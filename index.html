        // --- Module: State Management ---
        class AppState {
            constructor() {
                this._state = {
                    image: null,
                    audioBuffer: null,
                    audioContext: null,
                    isPlaying: false,
                    currentTime: 0,
                    duration: 0,
                    fps: 60,
                    frameCount: 0,
                    lastFrameTime: 0,
                    animationId: null,
                    currentViseme: 'Rest',
                    motionData: null,
                    settings: {
                        animSpeed: 1.0,
                        blinkFreq: 30,
                        headMotion: 50,
                        mouthSensitivity: 5,
                        jawStiffness: 250,
                        jawDamping: 30,
                        headStiffness: 180,
                        eyeStiffness: 300,
                        neuralAccuracy: 85,
                        motionSmoothing: 50,
                        enablePrediction: true,
                        renderQuality: 'medium',
                        renderEngine: 'canvas2d',
                        adaptiveQuality: true,
                        showDebug: false,
                    },
                    presets: {},
                    projects: {},
                    exportState: { isExporting: false, progress: 0 },
                    autoSave: { enabled: true, lastSave: 0, interval: 30000 },
                };
                this._listeners = new Map();
            }

            get(key) {
                return key ? this._state[key] : this._state;
            }

            set(key, value) {
                const oldValue = this._state[key];
                this._state[key] = value;
                this._notify(key, value, oldValue);
            }

            subscribe(key, callback) {
                if (!this._listeners.has(key)) {
                    this._listeners.set(key, new Set());
                }
                this._listeners.get(key).add(callback);
                return () => this._listeners.get(key).delete(callback);
            }

            _notify(key, value, oldValue) {
                if (this._listeners.has(key)) {
                    this._listeners.get(key).forEach(cb => cb(value, oldValue));
                }
            }

            // Persistence
            saveToStorage() {
                try {
                    const data = {
                        presets: this._state.presets,
                        projects: this._state.projects,
                        settings: this._state.settings,
                        autoSave: this._state.autoSave,
                    };
                    localStorage.setItem('ai-face-app-state', JSON.stringify(data));
                } catch (e) {
                    console.warn('Failed to save state:', e);
                }
            }

            loadFromStorage() {
                try {
                    const raw = localStorage.getItem('ai-face-app-state');
                    if (raw) {
                        const data = JSON.parse(raw);
                        Object.assign(this._state, data);
                        return true;
                    }
                } catch (e) {
                    console.warn('Failed to load state:', e);
                }
                return false;
            }
        }

        // --- Module: Event Bus ---
        class EventBus {
            constructor() {
                this._events = new Map();
            }

            on(event, callback) {
                if (!this._events.has(event)) {
                    this._events.set(event, new Set());
                }
                this._events.get(event).add(callback);
                return () => this._events.get(event).delete(callback);
            }

            emit(event, data) {
                if (this._events.has(event)) {
                    this._events.get(event).forEach(cb => {
                        try { cb(data); } catch (e) { console.error(e); }
                    });
                }
            }

            once(event, callback) {
                const wrapper = (data) => {
                    callback(data);
                    this._events.get(event).delete(wrapper);
                };
                this.on(event, wrapper);
            }
        }

        // --- Module: Toast System ---
        class ToastManager {
            constructor(container) {
                this.container = container;
                this.queue = [];
                this.active = false;
                this.icons = {
                    success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️'
                };
            }

            show(message, type = 'info', duration = 4000) {
                this.queue.push({ message, type, duration });
                this._processQueue();
            }

            _processQueue() {
                if (this.active || this.queue.length === 0) return;
                this.active = true;
                const { message, type, duration } = this.queue.shift();
                this._renderToast(message, type, duration);
            }

            _renderToast(message, type, duration) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <span>${this.icons[type] || 'ℹ️'}</span>
                    <span>${message}</span>
                    <button class="toast-close">✕</button>
                `;
                toast.querySelector('.toast-close').addEventListener('click', () => {
                    this._removeToast(toast);
                });
                this.container.appendChild(toast);

                setTimeout(() => {
                    this._removeToast(toast);
                }, duration);
            }

            _removeToast(toast) {
                if (!toast.parentNode) return;
                toast.classList.add('removing');
                setTimeout(() => {
                    toast.remove();
                    this.active = false;
                    this._processQueue();
                }, 400);
            }
        }

        // --- Module: Logger ---
        class Logger {
            constructor() {
                this.level = 'info';
                this.levels = { debug: 0, info: 1, warn: 2, error: 3 };
                this.history = [];
                this.maxHistory = 1000;
            }

            debug(...args) { this._log('debug', ...args); }
            info(...args) { this._log('info', ...args); }
            warn(...args) { this._log('warn', ...args); }
            error(...args) { this._log('error', ...args); }

            _log(level, ...args) {
                if (this.levels[level] < this.levels[this.level]) return;
                const entry = {
                    level,
                    message: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '),
                    timestamp: Date.now(),
                };
                this.history.push(entry);
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }
                console[level](...args);
            }

            getHistory() { return [...this.history]; }
        }

        // ============================================================
        // PHYSICS ENGINE
        // ============================================================
        class PhysicsEngine {
            constructor() {
                this.springs = new Map();
                this._dt = 1 / 60;
                this._substeps = 4;
            }

            createSpring(id, params = {}) {
                const spring = {
                    position: params.position || 0,
                    velocity: params.velocity || 0,
                    mass: params.mass || 1.0,
                    stiffness: params.stiffness || 200,
                    damping: params.damping || 25,
                    target: params.target || 0,
                };
                this.springs.set(id, spring);
                return spring;
            }

            updateSpring(id, target, dt = this._dt) {
                const spring = this.springs.get(id);
                if (!spring) return 0;

                const subDt = dt / this._substeps;
                for (let i = 0; i < this._substeps; i++) {
                    const error = spring.position - target;
                    const springForce = -spring.stiffness * error;
                    const dampingForce = -spring.damping * spring.velocity;
                    const acceleration = (springForce + dampingForce) / spring.mass;
                    spring.velocity += acceleration * subDt;
                    spring.position += spring.velocity * subDt;
                }
                return spring.position;
            }

            updateSpringWithDamping(id, target, dampingRatio = 1.0, dt = this._dt) {
                const spring = this.springs.get(id);
                if (!spring) return 0;

                const m = spring.mass;
                const k = spring.stiffness;
                const c_crit = 2 * Math.sqrt(m * k) * dampingRatio;

                const x = spring.position - target;
                const v = spring.velocity;
                const gamma = c_crit / (2 * m);
                const omega_d = Math.sqrt(Math.max(0, k / m - gamma * gamma));

                if (omega_d > 0) {
                    const amplitude = Math.sqrt(x * x + ((v + gamma * x) / omega_d) ** 2);
                    const phase = Math.atan2(v + gamma * x, x * omega_d);
                    spring.position = target + amplitude * Math.exp(-gamma * dt) *
                        Math.cos(omega_d * dt + phase);
                    spring.velocity = -amplitude * Math.exp(-gamma * dt) *
                        (gamma * Math.cos(omega_d * dt + phase) +
                            omega_d * Math.sin(omega_d * dt + phase));
                } else {
                    const springForce = -k * x;
                    const dampingForce = -c_crit * v;
                    const accel = (springForce + dampingForce) / m;
                    spring.velocity += accel * dt;
                    spring.position += spring.velocity * dt;
                }

                return spring.position;
            }

            setSpringParams(id, params) {
                const spring = this.springs.get(id);
                if (spring) {
                    Object.assign(spring, params);
                }
            }

            getSpring(id) {
                return this.springs.get(id);
            }

            resetAll() {
                this.springs.clear();
            }
        }

        // ============================================================
        // NEURAL ENGINE (Enhanced Simulation)
        // ============================================================
        class NeuralEngine {
            constructor() {
                this.phonemeMap = {
                    'A': { mouthOpen: 0.95, jawDrop: 0.8, viseme: 'aa' },
                    'E': { mouthOpen: 0.75, jawDrop: 0.5, viseme: 'ih' },
                    'I': { mouthOpen: 0.60, jawDrop: 0.3, viseme: 'iy' },
                    'O': { mouthOpen: 0.70, jawDrop: 0.6, viseme: 'ow' },
                    'U': { mouthOpen: 0.40, jawDrop: 0.2, viseme: 'uw' },
                    'M': { mouthOpen: 0.15, jawDrop: 0.1, viseme: 'm' },
                    'F': { mouthOpen: 0.20, jawDrop: 0.1, viseme: 'f' },
                    'S': { mouthOpen: 0.25, jawDrop: 0.1, viseme: 's' },
                    'Rest': { mouthOpen: 0.10, jawDrop: 0.0, viseme: 'rest' },
                };
                this.accuracy = 85;
                this.confidence = 0;
                this.envelope = 0;
                this.phonemeHistory = [];
                this.maxHistory = 20;
                this.lastPhoneme = 'Rest';
                this.visemeSequence = [];
                this.speechDetected = false;
                this._smoothFactor = 0.3;
            }

            process(audioData) {
                if (!audioData) {
                    this.envelope = this.envelope * 0.9 + 0.02;
                    this.speechDetected = false;
                    return this._getResult('Rest', 0.2);
                }

                // Real envelope detection
                const data = audioData.getChannelData(0);
                let rms = 0;
                const windowSize = Math.min(512, data.length);
                for (let i = 0; i < windowSize; i++) {
                    rms += data[i] * data[i];
                }
                rms = Math.sqrt(rms / windowSize);

                // Smooth envelope
                this.envelope = this.envelope * 0.85 + rms * 0.15;
                this.speechDetected = this.envelope > 0.02;

                // Phoneme detection (simulated)
                const threshold = this.envelope * 3;
                let bestPhoneme = 'Rest';
                let bestScore = 0;

                for (const [phoneme, params] of Object.entries(this.phonemeMap)) {
                    const score = threshold * (params.mouthOpen * 0.7 + 0.3) * (0.8 + Math.random() * 0.4);
                    if (score > bestScore) {
                        bestScore = score;
                        bestPhoneme = phoneme;
                    }
                }

                // Smooth transitions
                this.phonemeHistory.push(bestPhoneme);
                if (this.phonemeHistory.length > this.maxHistory) {
                    this.phonemeHistory.shift();
                }

                // Find most common in history
                const freq = {};
                let maxFreq = 0;
                let mostCommon = 'Rest';
                for (const p of this.phonemeHistory) {
                    freq[p] = (freq[p] || 0) + 1;
                    if (freq[p] > maxFreq) {
                        maxFreq = freq[p];
                        mostCommon = p;
                    }
                }

                const finalPhoneme = mostCommon;
                const params = this.phonemeMap[finalPhoneme] || this.phonemeMap['Rest'];

                // Calculate confidence based on speech detection and consistency
                const consistency = maxFreq / this.phonemeHistory.length;
                this.confidence = Math.min(1, (this.envelope * 2 + consistency * 0.5) * 0.8);

                return this._getResult(finalPhoneme, params);
            }

            _getResult(phoneme, params) {
                const p = params || this.phonemeMap[phoneme] || this.phonemeMap['Rest'];
                return {
                    envelope: this.envelope,
                    phoneme: phoneme,
                    viseme: p.viseme || 'rest',
                    mouthOpen: p.mouthOpen * (0.8 + 0.2 * this.envelope * 2),
                    jawDrop: p.jawDrop * (0.7 + 0.3 * this.envelope * 2),
                    confidence: this.confidence,
                    speechDetected: this.speechDetected,
                };
            }

            setAccuracy(accuracy) {
                this.accuracy = Math.max(0, Math.min(100, accuracy));
            }

            reset() {
                this.envelope = 0;
                this.confidence = 0;
                this.phonemeHistory = [];
                this.speechDetected = false;
            }
        }

        // ============================================================
        // SACCADE ENGINE
        // ============================================================
        class SaccadeEngine {
            constructor() {
                this.gazeX = 0;
                this.gazeY = 0;
                this.targetX = 0;
                this.targetY = 0;
                this.timer = 0;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.blinkPhase = 0;
                this.blinkDuration = 0.12;
                this.maxAngle = 0.12;
                this.minSaccadeInterval = 0.5;
                this.maxSaccadeInterval = 2.0;
                this._smoothSpeed = 6.0;
            }

            update(deltaTime, blinkFreq = 30) {
                this.timer -= deltaTime;
                this.blinkTimer -= deltaTime;

                // Saccade
                if (this.timer <= 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const amp = (0.3 + Math.random() * 0.7) * this.maxAngle;
                    this.targetX = Math.cos(angle) * amp;
                    this.targetY = Math.sin(angle) * amp;
                    this.timer = this.minSaccadeInterval + Math.random() * 
                        (this.maxSaccadeInterval - this.minSaccadeInterval);
                }

                // Smooth gaze movement
                const speed = this._smoothSpeed * deltaTime;
                this.gazeX += (this.targetX - this.gazeX) * Math.min(1, speed);
                this.gazeY += (this.targetY - this.gazeY) * Math.min(1, speed);

                // Blink
                const blinkThreshold = 1 - (blinkFreq / 100);
                if (this.blinkTimer <= 0 && !this.isBlinking && Math.random() > blinkThreshold) {
                    this.isBlinking = true;
                    this.blinkPhase = 0;
                    this.blinkTimer = 2.5 + Math.random() * 3.5;
                }

                let blinkIntensity = 0;
                if (this.isBlinking) {
                    this.blinkPhase += deltaTime / this.blinkDuration;
                    if (this.blinkPhase >= 1) {
                        this.isBlinking = false;
                        this.blinkPhase = 0;
                    }
                    // Cubic ease for more natural blink
                    const t = this.blinkPhase;
                    if (t < 0.5) {
                        blinkIntensity = 2 * t * t;
                    } else {
                        blinkIntensity = 1 - Math.pow(-2 * t + 2, 2) / 2;
                    }
                    // Add slight overshoot for realism
                    if (blinkIntensity > 1) blinkIntensity = 2 - blinkIntensity;
                    blinkIntensity = Math.max(0, Math.min(1, blinkIntensity));
                }

                return {
                    gazeX: this.gazeX,
                    gazeY: this.gazeY,
                    blink: blinkIntensity,
                    isBlinking: this.isBlinking,
                };
            }

            setMaxAngle(angle) {
                this.maxAngle = Math.max(0.01, Math.min(0.3, angle));
            }
        }

        // ============================================================
        // MOTION PIPELINE
        // ============================================================
        class MotionPipeline {
            constructor() {
                this.physics = new PhysicsEngine();
                this.saccade = new SaccadeEngine();

                // Create physics springs
                this.jawSpring = this.physics.createSpring('jaw', {
                    mass: 1.0,
                    stiffness: 250,
                    damping: 30,
                    position: 0.1,
                });

                this.headSpringX = this.physics.createSpring('headX', {
                    mass: 1.2,
                    stiffness: 180,
                    damping: 22,
                    position: 0,
                });

                this.headSpringY = this.physics.createSpring('headY', {
                    mass: 1.2,
                    stiffness: 180,
                    damping: 22,
                    position: 0,
                });

                this.eyeSpring = this.physics.createSpring('eye', {
                    mass: 0.5,
                    stiffness: 300,
                    damping: 40,
                    position: 0.5,
                });

                // State
                this.mouthOpen = 0.1;
                this.jawDrop = 0;
                this.headX = 0;
                this.headY = 0;
                this.phoneme = 'Rest';
                this.viseme = 'rest';
                this.confidence = 0;
                this.envelope = 0;
                this.breathPhase = 0;
                this.breathAmplitude = 0.005;
                this.motionHistory = [];
                this.maxHistory = 30;
                this.isSpeaking = false;

                // Smoothing
                this.smoothMouth = 0.1;
                this.smoothJaw = 0;
                this.smoothing = 0.5;
            }

            updateFrame(neuralResult, deltaTime, settings) {
                const { jawStiffness = 250, jawDamping = 30, headStiffness = 180, 
                        headMotion = 50, mouthSensitivity = 5, motionSmoothing = 50 } = settings || {};

                // Update physics parameters
                this.physics.setSpringParams('jaw', { stiffness: jawStiffness, damping: jawDamping });
                this.physics.setSpringParams('headX', { stiffness: headStiffness });
                this.physics.setSpringParams('headY', { stiffness: headStiffness });

                this.smoothing = motionSmoothing / 100;

                const isSpeaking = neuralResult && neuralResult.speechDetected;
                this.isSpeaking = isSpeaking;

                if (isSpeaking && neuralResult) {
                    // Real speech-driven animation
                    const targetMouth = neuralResult.mouthOpen * (0.6 + 0.4 * mouthSensitivity / 5);
                    const targetJaw = neuralResult.jawDrop * (0.5 + 0.5 * mouthSensitivity / 5);

                    // Physics solve
                    const jawPos = this.physics.updateSpringWithDamping('jaw', targetMouth, 0.85, deltaTime);
                    this.mouthOpen = jawPos;
                    this.jawDrop = targetJaw * 0.7;

                    // Head motion from speech
                    const headAmplitude = headMotion / 100 * 0.02;
                    const targetHeadX = (neuralResult.envelope - 0.5) * headAmplitude * 2;
                    const targetHeadY = (neuralResult.envelope - 0.5) * headAmplitude * 1.2;

                    this.physics.updateSpring('headX', targetHeadX, deltaTime);
                    this.physics.updateSpring('headY', targetHeadY, deltaTime);

                    this.headX = this.physics.getSpring('headX').position;
                    this.headY = this.physics.getSpring('headY').position;

                    this.phoneme = neuralResult.phoneme;
                    this.viseme = neuralResult.viseme;
                    this.confidence = neuralResult.confidence;
                    this.envelope = neuralResult.envelope;

                } else {
                    // Idle breathing
                    this.breathPhase += deltaTime * 0.25 * Math.PI * 2;
                    const breath = Math.sin(this.breathPhase) * this.breathAmplitude;

                    // Decay to rest
                    this.mouthOpen = 0.1 + 0.03 * Math.sin(this.breathPhase * 0.5);
                    this.jawDrop = 0;

                    // Gentle head sway
                    const swayAmplitude = 0.003 * (headMotion / 100);
                    this.headX = Math.sin(this.breathPhase * 0.3) * swayAmplitude;
                    this.headY = breath * 0.8;

                    this.phoneme = 'Rest';
                    this.viseme = 'rest';
                    this.confidence = 0.2;
                    this.envelope = 0.01;
                }

                // Saccade update
                const eyes = this.saccade.update(deltaTime, settings?.blinkFreq || 30);

                // Record motion
                const result = {
                    mouthOpen: this.mouthOpen,
                    jawDrop: this.jawDrop,
                    headX: this.headX,
                    headY: this.headY,
                    gazeX: eyes.gazeX,
                    gazeY: eyes.gazeY,
                    blink: eyes.blink,
                    phoneme: this.phoneme,
                    viseme: this.viseme,
                    confidence: this.confidence,
                    envelope: this.envelope,
                    isSpeaking: this.isSpeaking,
                    timestamp: performance.now(),
                };

                // History for smoothing
                this.motionHistory.push(result);
                if (this.motionHistory.length > this.maxHistory) {
                    this.motionHistory.shift();
                }

                return result;
            }

            getSmoothedMotion() {
                if (this.motionHistory.length === 0) return null;
                const recent = this.motionHistory.slice(-5);
                const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;

                return {
                    mouthOpen: avg(recent.map(r => r.mouthOpen)),
                    jawDrop: avg(recent.map(r => r.jawDrop)),
                    headX: avg(recent.map(r => r.headX)),
                    headY: avg(recent.map(r => r.headY)),
                    gazeX: avg(recent.map(r => r.gazeX)),
                    gazeY: avg(recent.map(r => r.gazeY)),
                    blink: avg(recent.map(r => r.blink)),
                    phoneme: recent[recent.length - 1]?.phoneme || 'Rest',
                    confidence: avg(recent.map(r => r.confidence)),
                };
            }

            reset() {
                this.physics.resetAll();
                this.mouthOpen = 0.1;
                this.jawDrop = 0;
                this.headX = 0;
                this.headY = 0;
                this.phoneme = 'Rest';
                this.confidence = 0;
                this.envelope = 0;
                this.breathPhase = 0;
                this.motionHistory = [];
                this.isSpeaking = false;
            }
        }

        // ============================================================
        // RENDERER
        // ============================================================
        class Renderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = null;
                this.imageTexture = null;
                this.width = 0;
                this.height = 0;
                this.dpr = Math.min(devicePixelRatio, 2);
                this.quality = 'medium';
                this._initialized = false;
                this._debug = false;
                this._lastRender = 0;
                this._fps = 60;
                this._frameCount = 0;
                this._fpsUpdate = 0;
            }

            initialize(width, height) {
                this.width = width;
                this.height = height;
                this.dpr = Math.min(devicePixelRatio, 2);

                this.canvas.width = width * this.dpr;
                this.canvas.height = height * this.dpr;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';

                this.ctx = this.canvas.getContext('2d', {
                    alpha: false,
                    desynchronized: true,
                    willReadFrequently: false,
                });

                this._initialized = true;
                this._setupAntiAliasing();
            }

            _setupAntiAliasing() {
                if (this.ctx) {
                    this.ctx.imageSmoothingEnabled = true;
                    this.ctx.imageSmoothingQuality = 'high';
                }
            }

            setQuality(quality) {
                this.quality = quality || 'medium';
            }

            setDebug(debug) {
                this._debug = debug;
            }

            uploadTexture(image) {
                this.imageTexture = image;
            }

            render(motionData) {
                if (!this._initialized || !this.ctx) return;

                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;

                // Clear and background
                ctx.clearRect(0, 0, w, h);
                const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
                gradient.addColorStop(0, '#1a1a3e');
                gradient.addColorStop(1, '#0a0a1a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                if (!this.imageTexture) {
                    this._drawPlaceholder(ctx, w, h);
                    return;
                }

                // Draw image with face tracking
                const img = this.imageTexture;
                const aspect = img.width / img.height;
                let drawW, drawH, ox, oy;

                if (aspect > 1) {
                    drawW = w * 0.92;
                    drawH = drawW / aspect;
                    ox = (w - drawW) / 2;
                    oy = (h - drawH) / 2;
                } else {
                    drawH = h * 0.92;
                    drawW = drawH * aspect;
                    ox = (w - drawW) / 2;
                    oy = (h - drawH) / 2;
                }

                const state = motionData || {};

                ctx.save();

                // Clip to circle
                ctx.beginPath();
                ctx.ellipse(w / 2, h / 2, w / 2 * 0.95, h / 2 * 0.95, 0, 0, Math.PI * 2);
                ctx.clip();

                // Draw image
                ctx.drawImage(img, ox, oy, drawW, drawH);

                // Facial animation overlay
                this._drawFaceOverlay(ctx, state, ox, oy, drawW, drawH);

                ctx.restore();

                // Debug overlay
                if (this._debug) {
                    this._drawDebugOverlay(ctx, state, w, h);
                }

                // FPS tracking
                this._frameCount++;
                const now = performance.now();
                if (now - this._fpsUpdate > 1000) {
                    this._fps = this._frameCount;
                    this._frameCount = 0;
                    this._fpsUpdate = now;
                }
            }

            _drawFaceOverlay(ctx, state, ox, oy, drawW, drawH) {
                const faceX = ox + drawW * 0.35 + (state.gazeX || 0) * drawW * 0.08;
                const faceY = oy + drawH * 0.25 + (state.gazeY || 0) * drawH * 0.06;
                const faceW = drawW * 0.35;
                const faceH = drawH * 0.40;

                // Eyes
                const eyeY = faceY + faceH * 0.35;
                const eyeW = faceW * 0.13;
                const eyeH = faceH * 0.09 * (1 - (state.blink || 0) * 0.9);

                [-1, 1].forEach(side => {
                    const eyeX = faceX + faceW * 0.5 + side * (faceW * 0.27 + (state.gazeX || 0) * faceW * 0.04);
                    
                    // Eye white
                    ctx.beginPath();
                    ctx.ellipse(eyeX, eyeY + (state.gazeY || 0) * faceH * 0.02, eyeW, eyeH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.fill();

                    if (eyeH > 3) {
                        // Iris
                        const irisX = eyeX + side * eyeW * 0.25;
                        const irisY = eyeY + (state.gazeY || 0) * faceH * 0.02;
                        ctx.beginPath();
                        ctx.arc(irisX, irisY, eyeW * 0.45, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(30, 30, 60, 0.85)';
                        ctx.fill();

                        // Pupil
                        ctx.beginPath();
                        ctx.arc(irisX + side * eyeW * 0.08, irisY + eyeH * 0.05, eyeW * 0.18, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(5, 5, 20, 0.95)';
                        ctx.fill();

                        // Highlight
                        ctx.beginPath();
                        ctx.arc(irisX + side * eyeW * 0.12, irisY - eyeH * 0.1, eyeW * 0.08, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.fill();
                    }
                });

                // Mouth
                const mouthX = faceX + faceW * 0.5;
                const mouthY = faceY + faceH * 0.72 + (state.jawDrop || 0) * faceH * 0.1;
                const mouthOpen = state.mouthOpen || 0.1;
                const mouthW = faceW * 0.32;
                const mouthH = faceH * 0.12 * (1 + mouthOpen * 2.5);

                // Mouth shape
                ctx.beginPath();
                ctx.ellipse(mouthX, mouthY, mouthW, mouthH, 0, 0, Math.PI * 2);
                
                // Inner mouth
                if (mouthOpen > 0.15) {
                    const innerH = mouthH * 0.5 * (1 + mouthOpen * 0.5);
                    ctx.fillStyle = `rgba(120, 30, 30, ${0.4 + mouthOpen * 0.5})`;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + mouthH * 0.1, mouthW * 0.6, innerH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(60, 10, 10, ${0.3 + mouthOpen * 0.5})`;
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(200, 80, 80, 0.6)';
                    ctx.fill();
                }

                // Mouth line
                ctx.beginPath();
                ctx.ellipse(mouthX, mouthY - mouthH * 0.2, mouthW * 0.8, mouthH * 0.15, 0, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(160, 60, 60, ${0.3 + mouthOpen * 0.4})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Eyebrows (simplified)
                const browY = faceY + faceH * 0.15;
                const browW = faceW * 0.2;
                [-1, 1].forEach(side => {
                    const browX = faceX + faceW * 0.5 + side * (faceW * 0.22);
                    ctx.beginPath();
                    ctx.moveTo(browX - browW * 0.5, browY - 2);
                    ctx.quadraticCurveTo(browX, browY - 6 - (state.gazeY || 0) * 2, browX + browW * 0.5, browY - 2);
                    ctx.strokeStyle = 'rgba(100, 80, 60, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }

            _drawPlaceholder(ctx, w, h) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.font = `${Math.min(w, h) * 0.06}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📸 Upload a portrait', w / 2, h / 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.font = `${Math.min(w, h) * 0.03}px system-ui, sans-serif`;
                ctx.fillText('to start', w / 2, h / 2 + Math.min(w, h) * 0.08);
            }

            _drawDebugOverlay(ctx, state, w, h) {
                const lines = [
                    `FPS: ${this._fps}`,
                    `Phoneme: ${state.phoneme || 'Rest'}`,
                    `Mouth: ${(state.mouthOpen || 0).toFixed(3)}`,
                    `Blink: ${(state.blink || 0).toFixed(2)}`,
                    `Confidence: ${((state.confidence || 0) * 100).toFixed(0)}%`,
                    `Engine: Canvas2D`,
                ];

                const x = 14, y = 14;
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.roundRect(x, y, 170, 18 + lines.length * 20, 8);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = '11px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                lines.forEach((line, i) => {
                    ctx.fillText(line, x + 10, y + 8 + i * 20);
                });
            }

            dispose() {
                this.ctx = null;
                this.imageTexture = null;
                this._initialized = false;
            }
        }

        // ============================================================
        // AUDIO ENGINE
        // ============================================================
        class AudioEngine {
            constructor() {
                this.context = null;
                this.buffer = null;
                this.source = null;
                this.isPlaying = false;
                this.duration = 0;
                this.currentTime = 0;
                this.pauseTime = 0;
                this.startTime = 0;
                this.analyser = null;
                this._initialized = false;
                this._onEndCallback = null;
            }

            async initialize() {
                if (this._initialized) return;
                try {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.context.createAnalyser();
                    this.analyser.fftSize = 1024;
                    this._initialized = true;
                    return true;
                } catch (e) {
                    console.error('Failed to initialize AudioContext:', e);
                    return false;
                }
            }

            async loadBuffer(arrayBuffer) {
                try {
                    await this.initialize();
                    const buffer = await this.context.decodeAudioData(arrayBuffer);
                    this.buffer = buffer;
                    this.duration = buffer.duration;
                    this.currentTime = 0;
                    this.pauseTime = 0;
                    return buffer;
                } catch (e) {
                    console.error('Failed to decode audio:', e);
                    throw e;
                }
            }

            play() {
                if (!this.buffer || !this.context) return false;
                if (this.isPlaying) {
                    this.pause();
                    return true;
                }

                try {
                    const source = this.context.createBufferSource();
                    source.buffer = this.buffer;
                    source.connect(this.analyser);
                    this.analyser.connect(this.context.destination);
                    source.start(0, this.pauseTime);
                    this.source = source;
                    this.isPlaying = true;
                    this.startTime = this.context.currentTime - this.pauseTime;

                    source.onended = () => {
                        this.isPlaying = false;
                        this.pauseTime = 0;
                        if (this._onEndCallback) {
                            this._onEndCallback();
                        }
                    };

                    return true;
                } catch (e) {
                    console.error('Failed to play audio:', e);
                    return false;
                }
            }

            pause() {
                if (this.source && this.isPlaying) {
                    this.pauseTime = this.context.currentTime - this.startTime;
                    this.source.stop();
                    this.source = null;
                    this.isPlaying = false;
                    return true;
                }
                return false;
            }

            stop() {
                if (this.source) {
                    this.source.stop();
                    this.source = null;
                }
                this.isPlaying = false;
                this.pauseTime = 0;
                this.currentTime = 0;
            }

            getCurrentTime() {
                if (this.isPlaying && this.context) {
                    return this.context.currentTime - this.startTime;
                }
                return this.pauseTime;
            }

            getData() {
                if (!this.analyser) return null;
                const data = new Float32Array(this.analyser.fftSize);
                this.analyser.getFloatTimeDomainData(data);
                return data;
            }

            getFrequencyData() {
                if (!this.analyser) return null;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                return data;
            }

            setOnEnd(callback) {
                this._onEndCallback = callback;
            }

            async resumeContext() {
                if (this.context && this.context.state === 'suspended') {
                    await this.context.resume();
                }
            }

            dispose() {
                if (this.source) {
                    this.source.stop();
                    this.source = null;
                }
                if (this.context) {
                    this.context.close();
                    this.context = null;
                }
                this.buffer = null;
                this._initialized = false;
            }
        }

        // ============================================================
        // EXPORT ENGINE
        // ============================================================
        class ExportEngine {
            constructor() {
                this.isExporting = false;
                this.progress = 0;
                this.cancelled = false;
                this._stream = null;
                this._recorder = null;
                this._chunks = [];
                this._onProgress = null;
                this._onComplete = null;
                this._onError = null;
            }

            async exportVideo(canvas, audioBuffer, settings = {}) {
                if (this.isExporting) {
                    throw new Error('Export already in progress');
                }

                this.isExporting = true;
                this.progress = 0;
                this.cancelled = false;
                this._chunks = [];

                const {
                    quality = 'medium',
                    fps = 30,
                    resolution = 1080,
                    duration = 10,
                } = settings;

                try {
                    // Create stream from canvas
                    const stream = canvas.captureStream(fps);
                    this._stream = stream;

                    // Setup recorder
                    const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
                    let mimeType = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

                    const recorder = new MediaRecorder(stream, {
                        mimeType,
                        videoBitsPerSecond: this._getBitrate(quality),
                    });

                    this._recorder = recorder;

                    recorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            this._chunks.push(e.data);
                        }
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(this._chunks, { type: mimeType });
                        this._onComplete?.(blob);
                        this.isExporting = false;
                        this.progress = 100;
                    };

                    recorder.onerror = (e) => {
                        this._onError?.(e);
                        this.isExporting = false;
                    };

                    // Start recording
                    const sliceTime = 1000 / fps;
                    recorder.start(sliceTime);

                    // Simulate progress
                    await this._simulateProgress(duration);

                    // Stop recording
                    if (!this.cancelled) {
                        recorder.stop();
                    }

                    return true;
                } catch (e) {
                    this._onError?.(e);
                    this.isExporting = false;
                    throw e;
                }
            }

            _getBitrate(quality) {
                const rates = {
                    low: 1000000,
                    medium: 2500000,
                    high: 5000000,
                    lossless: 10000000,
                };
                return rates[quality] || rates.medium;
            }

            async _simulateProgress(duration) {
                const steps = Math.max(20, duration * 2);
                const stepTime = 200;
                let elapsed = 0;

                while (elapsed < duration * 1000 && !this.cancelled) {
                    await new Promise(resolve => setTimeout(resolve, stepTime));
                    elapsed += stepTime;
                    this.progress = Math.min(95, (elapsed / (duration * 1000)) * 100);
                    this._onProgress?.(this.progress);
                }

                if (!this.cancelled) {
                    this.progress = 100;
                    this._onProgress?.(100);
                }
            }

            cancel() {
                this.cancelled = true;
                if (this._recorder && this._recorder.state === 'recording') {
                    this._recorder.stop();
                }
                if (this._stream) {
                    this._stream.getTracks().forEach(t => t.stop());
                }
                this.isExporting = false;
            }

            onProgress(callback) {
                this._onProgress = callback;
            }

            onComplete(callback) {
                this._onComplete = callback;
            }

            onError(callback) {
                this._onError = callback;
            }
        }

        // ============================================================
        // STORAGE MANAGER
        // ============================================================
        class StorageManager {
            constructor() {
                this.dbName = 'AIFaceDB';
                this.dbVersion = 1;
                this.db = null;
                this._initialized = false;
            }

            async initialize() {
                if (this._initialized) return;

                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('projects')) {
                            db.createObjectStore('projects', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('presets')) {
                            db.createObjectStore('presets', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('history')) {
                            db.createObjectStore('history', { keyPath: 'timestamp' });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        this._initialized = true;
                        resolve();
                    };

                    request.onerror = (e) => {
                        reject(e.target.error);
                    };
                });
            }

            async save(key, data, store = 'projects') {
                await this.ensureInitialized();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(store, 'readwrite');
                    const objectStore = transaction.objectStore(store);
                    const request = objectStore.put({ id: key, data, timestamp: Date.now() });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async load(key, store = 'projects') {
                await this.ensureInitialized();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(store, 'readonly');
                    const objectStore = transaction.objectStore(store);
                    const request = objectStore.get(key);
                    request.onsuccess = () => resolve(request.result?.data || null);
                    request.onerror = () => reject(request.error);
                });
            }

            async list(store = 'projects') {
                await this.ensureInitialized();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(store, 'readonly');
                    const objectStore = transaction.objectStore(store);
                    const request = objectStore.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async delete(key, store = 'projects') {
                await this.ensureInitialized();
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(store, 'readwrite');
                    const objectStore = transaction.objectStore(store);
                    const request = objectStore.delete(key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async ensureInitialized() {
                if (!this._initialized) {
                    await this.initialize();
                }
            }
        }

                // Image upload

                imageDropzone.addEventListener('click', () => imageInput.click());
                imageDropzone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    imageDropzone.style.borderColor = 'var(--gradient-start)';
                });
                imageDropzone.addEventListener('dragleave', () => {
                    imageDropzone.style.borderColor = '';

                    if (file) this._handleImage(file);
                });
                imageInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) this._handleImage(e.target.files[0]);

                });

                    audioDropzone.style.borderColor = '';
                });
                audioDropzone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    audioDropzone.style.borderColor = '';
                    const file = e.dataTransfer.files[0];

                // Remove buttons
                this.dom.removeImageBtn.addEventListener('click', () => this._removeImage());
                this.dom.removeAudioBtn.addEventListener('click', () => this._removeAudio());

                // Drop zone on preview
                this.dom.dropZone.addEventListener('click', () => this.dom.imageUpload.click());
                this.dom.imageUpload.addEventListener('change', (e) => {
                    if (e.target.files[0]) this._handleImage(e.target.files[0]);
                });
            }

            async _handleImage(file) {
                if (!file || !file.type.startsWith('image/')) {
                    this.toast.show('Please upload a valid image file', 'error');
                    return;
                }

                try {
                    const img = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const image = new Image();
                            image.onload = () => resolve(image);
                            image.onerror = reject;
                            image.src = e.target.result;
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });

                    this.state.set('image', img);
                    this.renderer.uploadTexture(img);
                    this.dom.imagePreview.src = img.src;
                    this.dom.imagePreviewContainer.hidden = false;
                    this.dom.imageDropzone.style.display = 'none';
                    this.dom.imageStatus.textContent = `✅ ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
                    this.dom.imageStatus.style.color = 'var(--success)';
                    this.dom.previewOverlay.classList.add('hidden');

                    this.toast.show(`✅ Image loaded: ${file.name}`, 'success');
                    this.logger.info('Image loaded:', file.name);

                    // Auto-save
                    this._triggerAutoSave();

                } catch (error) {
                    this.logger.error('Failed to load image:', error);
                    this.toast.show(`❌ Failed to load image: ${error.message}`, 'error');
                }
            }

            async _handleAudio(file) {
                if (!file || !file.type.startsWith('audio/')) {
                    this.toast.show('Please upload a valid audio file', 'error');
                    return;
                }

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const buffer = await this.audio.loadBuffer(arrayBuffer);

                    this.state.set('audioBuffer', buffer);
                    this.state.set('duration', buffer.duration);

                    this.dom.audioName.textContent = file.name;
                    this.dom.audioDuration.textContent = this._formatTime(buffer.duration);
                    this.dom.audioInfoContainer.hidden = false;
                    this.dom.audioDropzone.style.display = 'none';
                    this.dom.audioStatus.textContent = `✅ ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
                    this.dom.audioStatus.style.color = 'var(--success)';
                    this.dom.audioAnalysis.textContent = '🧠 Neural engine ready';

                    // Draw waveform
                    this._drawWaveform(buffer);
                    this._drawSpectrum(buffer);

                    this.toast.show(`✅ Audio loaded: ${file.name}`, 'success');
                    this.logger.info('Audio loaded:', file.name);

                    // Auto-save
                    this._triggerAutoSave();

                } catch (error) {
                    this.logger.error('Failed to load audio:', error);
                    this.toast.show(`❌ Failed to load audio: ${error.message}`, 'error');
                }
            }

            _removeImage() {
                this.state.set('image', null);
                this.renderer.uploadTexture(null);
                this.dom.imagePreviewContainer.hidden = true;
                this.dom.imageDropzone.style.display = '';
                this.dom.imageStatus.textContent = 'No image uploaded';
                this.dom.imageStatus.style.color = '';
                this.dom.previewOverlay.classList.remove('hidden');
                this.toast.show('Image removed', 'info');
            }

            _removeAudio() {
                this.state.set('audioBuffer', null);
                this.state.set('duration', 0);
                this.audio.stop();
                this.dom.audioInfoContainer.hidden = true;
                this.dom.audioDropzone.style.display = '';
                this.dom.audioStatus.textContent = 'No audio uploaded';
                this.dom.audioStatus.style.color = '';
                this.dom.audioAnalysis.textContent = 'Neural engine ready';
                this.motion.reset();
                this.toast.show('Audio removed', 'info');
            }

            // ============================================================
            // SETTINGS
            // ============================================================
            _setupSettings() {
                const bindings = [
                    { el: this.dom.animSpeed, val: this.dom.animSpeedVal, key: 'animSpeed', fmt: v => `${v.toFixed(1)}x` },
                    { el: this.dom.blinkFreq, val: this.dom.blinkFreqVal, key: 'blinkFreq', fmt: v => `${v}%` },
                    { el: this.dom.headMotion, val: this.dom.headMotionVal, key: 'headMotion', fmt: v => `${v}%` },
                    { el: this.dom.mouthSensitivity, val: this.dom.mouthSensitivityVal, key: 'mouthSensitivity', fmt: v => v },
                    { el: this.dom.jawStiffness, val: this.dom.jawStiffnessVal, key: 'jawStiffness', fmt: v => v },
                    { el: this.dom.jawDamping, val: this.dom.jawDampingVal, key: 'jawDamping', fmt: v => v },
                    { el: this.dom.headStiffness, val: this.dom.headStiffnessVal, key: 'headStiffness', fmt: v => v },
                    { el: this.dom.eyeStiffness, val: this.dom.eyeStiffnessVal, key: 'eyeStiffness', fmt: v => v },
                    { el: this.dom.neuralAccuracy, val: this.dom.neuralAccuracyVal, key: 'neuralAccuracy', fmt: v => `${v}%` },
                    { el: this.dom.motionSmoothing, val: this.dom.motionSmoothingVal, key: 'motionSmoothing', fmt: v => `${v}%` },
                ];

                bindings.forEach(({ el, val, key, fmt }) => {
                    if (!el) return;
                    const value = this.state.get('settings')[key];
                    if (value !== undefined) {
                        el.value = value;
                        if (val) val.textContent = fmt(value);
                    }
                    el.addEventListener('input', (e) => {
                        const v = parseFloat(e.target.value);
                        this.state.set('settings', {
                            ...this.state.get('settings'),
                            [key]: v,
                        });
                        if (val) val.textContent = fmt(v);
                        if (key === 'neuralAccuracy') {
                            this.neural.setAccuracy(v);
                        }
                        if (key === 'showDebug') {
                            this.renderer.setDebug(v);
                        }
                    });
                });

                // Checkboxes
                const checkboxBindings = [
                    { el: this.dom.enablePrediction, key: 'enablePrediction' },
                    { el: this.dom.adaptiveQuality, key: 'adaptiveQuality' },
                ];

                checkboxBindings.forEach(({ el, key }) => {
                    if (!el) return;
                    const value = this.state.get('settings')[key];
                    if (value !== undefined) el.checked = value;
                    el.addEventListener('change', (e) => {
                        this.state.set('settings', {
                            ...this.state.get('settings'),
                            [key]: e.target.checked,
                        });
                    });
                });

                // Selects
                const selectBindings = [
                    { el: this.dom.renderQuality, key: 'renderQuality' },
                    { el: this.dom.renderEngine, key: 'renderEngine' },
                ];

                selectBindings.forEach(({ el, key }) => {
                    if (!el) return;
                    const value = this.state.get('settings')[key];
                    if (value !== undefined) el.value = value;
                    el.addEventListener('change', (e) => {
                        this.state.set('settings', {
                            ...this.state.get('settings'),
                            [key]: e.target.value,
                        });
                        if (key === 'renderQuality') {
                            this.renderer.setQuality(e.target.value);
                        }
                    });
                });
            }

            // ============================================================
            // PLAYBACK
            // ============================================================
            _setupPlayback() {
                // Play/pause
                const playHandler = () => this._togglePlayback();
                this.dom.playBtn.addEventListener('click', playHandler);
                this.dom.playPauseBtn.addEventListener('click', playHandler);

                // Timeline
                this.dom.timelineSlider.addEventListener('input', (e) => {
                    const pct = parseFloat(e.target.value) / 100;
                    const time = pct * (this.state.get('duration') || 1);
                    this._seek(time);
                });

                // Rewind/forward
                this.dom.rewindBtn.addEventListener('click', () => this._seek(0));
                this.dom.forwardBtn.addEventListener('click', () => {
                    const current = this.audio.getCurrentTime() || 0;
                    this._seek(Math.min(current + 5, this.state.get('duration') || 0));
                });

                // Audio end
                this.audio.setOnEnd(() => {
                    this.state.set('isPlaying', false);
                    this.dom.playBtn.textContent = '▶';
                    this.dom.playPauseBtn.textContent = '▶';
                    this.motion.reset();
                    this._updateStatus('Ready', 'online');
                });
            }

            _togglePlayback() {
                if (!this.state.get('audioBuffer')) {
                    this.toast.show('⚠️ Please upload an audio file first', 'warning');
                    return;
                }
                if (!this.state.get('image')) {
                    this.toast.show('⚠️ Please upload a portrait image first', 'warning');
                    return;
                }

                if (this.state.get('isPlaying')) {
                    this.audio.pause();
                    this.state.set('isPlaying', false);
                    this.dom.playBtn.textContent = '▶';
                    this.dom.playPauseBtn.textContent = '▶';
                    this._updateStatus('Paused', 'online');
                } else {
                    this.audio.resumeContext();
                    const success = this.audio.play();
                    if (success) {
                        this.state.set('isPlaying', true);
                        this.dom.playBtn.textContent = '⏸';
                        this.dom.playPauseBtn.textContent = '⏸';
                        this._updateStatus('Playing', 'online');

                        // Start render loop if not running
                        if (!this._animationId) {
                            this._startRenderLoop();
                        }
                    }
                }
            }

            _seek(time) {
                const duration = this.state.get('duration') || 1;
                const clamped = Math.max(0, Math.min(duration, time));
                this.audio.stop();
                this.audio.pauseTime = clamped;
                this.motion.reset();
                this.state.set('isPlaying', false);
                this.dom.playBtn.textContent = '▶';
                this.dom.playPauseBtn.textContent = '▶';
                this.dom.timelineSlider.value = (clamped / duration) * 100;
                this.dom.timeDisplay.textContent = `${this._formatTime(clamped)} / ${this._formatTime(duration)}`;
            }

                const settings = { ...this.state.get('settings'), ...presets[name].settings };
                this.state.set('settings', settings);
                this._updateSettingsUI();

                const presets = { ...this.state.get('presets') };

                this._renderPresets();

                        </div>

                    expressive: { blinkFreq: 40, headMotion: 70, mouthSensitivity: 7, jawStiffness: 200, jawDamping: 25, animSpeed: 1.1 },
                    calm: { blinkFreq: 15, headMotion: 20, mouthSensitivity: 3, jawStiffness: 320, jawDamping: 40, animSpeed: 0.8 },

                if (now - autoSave.lastSave < autoSave.interval) return;

                const name = `AutoSave_${new Date().toLocaleString().replace(/[/:\s]/g, '-')}`;
                const projects = { ...this.state.get('projects') };
                projects[name] = {
                    timestamp: now,
                    settings: { ...this.state.get('settings') },
                    image: this.state.get('image')?.src || null,

                this.state.set('projects', projects);
                this.state.saveToStorage();

                autoSave.lastSave = now;

            async _startExport() {
                if (!this.state.get('image')) {
                    this.toast.show('⚠️ Please upload an image first', 'warning');

                }

                if (this.export.isExporting) {
                    this.export.cancel();

                    this.toast.show('Export cancelled', 'info');
                    return;
                }

                const quality = this.dom.exportQuality.value;
                const fps = parseInt(this.dom.exportFps.value);
                const resolution = parseInt(this.dom.exportResolution.value);

                const duration = this.state.get('duration') || 5;

                this.dom.exportStatus.textContent = 'Starting export...';

                try {
                    await this.export.exportVideo(
                        this.renderer.canvas,
                        this.state.get('audioBuffer'),
                        { quality, fps, resolution, duration }
                    );
                } catch (error) {
                    this.logger.error('Export error:', error);
                    this.dom.exportStatus.textContent = '❌ Export failed';
                    this.toast.show(`❌ Export failed: ${error.message}`, 'error');
                }

            _downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            // ============================================================
            // WAVEFORM & SPECTRUM
            // ============================================================
            _drawWaveform(buffer) {
                const canvas = this.dom.waveformCanvas;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                const width = rect.width || 600;
                const height = rect.height || 60;

                canvas.width = width * devicePixelRatio;
                canvas.height = height * devicePixelRatio;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.scale(devicePixelRatio, devicePixelRatio);

                const data = buffer.getChannelData(0);
                const step = Math.floor(data.length / width);

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(102, 126, 234, 0.08)';
                ctx.fillRect(0, 0, width, height);

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(102, 126, 234, 0.7)';
                ctx.lineWidth = 2;

                for (let i = 0; i < width; i++) {
                    const idx = Math.floor(i * step);
                    const val = data[idx] || 0;
                    const y = (height / 2) + (val * 0.8 * height / 2);
                    if (i === 0) ctx.moveTo(i, y);
                    else ctx.lineTo(i, y);
                }
                ctx.stroke();
                ctx.lineTo(width, height / 2);
                ctx.closePath();
                ctx.fillStyle = 'rgba(102, 126, 234, 0.12)';
                ctx.fill();
            }

            _drawSpectrum(buffer) {
                const data = buffer.getChannelData(0);
                const fftSize = 256;
                const spectrum = new Float32Array(fftSize / 2);

                for (let i = 0; i < fftSize && i < data.length; i++) {
                    spectrum[i % (fftSize / 2)] += Math.abs(data[i]);
                }

                const container = this.dom.spectrumDisplay;
                container.innerHTML = '';
                for (let i = 0; i < spectrum.length; i += 3) {
                    const val = Math.min(1, spectrum[i] / 10);
                    const bar = document.createElement('div');
                    bar.className = 'spectrum-bar';
                    bar.style.height = Math.max(2, val * 100) + 'px';
                    container.appendChild(bar);
                }
            }

            // ============================================================
            // RENDER LOOP
            // ============================================================
            _startRenderLoop() {
                if (this._animationId) return;
                this._lastFrameTime = performance.now();
                this._frameCount = 0;
                this._fpsUpdate = 0;
                this._loop();
            }

            _loop() {
                this._animationId = requestAnimationFrame(() => this._loop());

                const now = performance.now();
                const deltaTime = Math.min(1/30, (now - this._lastFrameTime) / 1000);
                this._lastFrameTime = now;

                // Update audio time
                if (this.state.get('isPlaying')) {
                    const time = this.audio.getCurrentTime() || 0;
                    const duration = this.state.get('duration') || 1;
                    this.dom.timelineSlider.value = (time / duration) * 100;
                    this.dom.timeDisplay.textContent = `${this._formatTime(time)} / ${this._formatTime(duration)}`;
                }

                // Get audio data for neural processing
                let audioData = null;
                if (this.state.get('isPlaying') && this.state.get('audioBuffer')) {
                    const data = this.audio.getData();
                    if (data) {
                        audioData = { getChannelData: () => data };
                    }
                }

                // Process neural
                const neuralResult = this.neural.process(audioData);

                // Update motion
                const settings = this.state.get('settings');
                const motionData = this.motion.updateFrame(neuralResult, deltaTime, settings);

                // Render
                this.renderer.render(motionData);

                // Update UI
                this._updateUI(motionData);

                // Update stats
                this._frameCount++;
                if (now - this._fpsUpdate > 1000) {
                    const fps = this._frameCount;
                    this._frameCount = 0;
                    this._fpsUpdate = now;
                    if (this.dom.fpsCounter) {
                        this.dom.fpsCounter.textContent = fps;
                    }
                    if (performance.memory && this.dom.memoryUsage) {
                        this.dom.memoryUsage.textContent = 
                            (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(0) + ' MB';
                    }
                }
            }

            _updateUI(motionData) {
                if (!motionData) return;

                // Phoneme display
                if (this.dom.phonemeValuesPro) {
                    this.dom.phonemeValuesPro.textContent = motionData.phoneme || '—';
                }
                if (this.dom.phonemeConfidence) {
                    this.dom.phonemeConfidence.textContent = 
                        `${Math.round((motionData.confidence || 0) * 100)}%`;
                }
            }

            _updateSettingsUI() {
                const settings = this.state.get('settings');
                const mapping = {
                    animSpeed: { el: this.dom.animSpeed, val: this.dom.animSpeedVal, fmt: v => `${v.toFixed(1)}x` },
                    blinkFreq: { el: this.dom.blinkFreq, val: this.dom.blinkFreqVal, fmt: v => `${v}%` },
                    headMotion: { el: this.dom.headMotion, val: this.dom.headMotionVal, fmt: v => `${v}%` },
                    mouthSensitivity: { el: this.dom.mouthSensitivity, val: this.dom.mouthSensitivityVal, fmt: v => v },
                    jawStiffness: { el: this.dom.jawStiffness, val: this.dom.jawStiffnessVal, fmt: v => v },
                    jawDamping: { el: this.dom.jawDamping, val: this.dom.jawDampingVal, fmt: v => v },
                    headStiffness: { el: this.dom.headStiffness, val: this.dom.headStiffnessVal, fmt: v => v },
                    eyeStiffness: { el: this.dom.eyeStiffness, val: this.dom.eyeStiffnessVal, fmt: v => v },
                    neuralAccuracy: { el: this.dom.neuralAccuracy, val: this.dom.neuralAccuracyVal, fmt: v => `${v}%` },
                    motionSmoothing: { el: this.dom.motionSmoothing, val: this.dom.motionSmoothingVal, fmt: v => `${v}%` },
                };

                Object.entries(mapping).forEach(([key, { el, val, fmt }]) => {
                    if (el && settings[key] !== undefined) {
                        el.value = settings[key];
                        if (val) val.textContent = fmt(settings[key]);
                    }
                });

                // Checkboxes
                if (this.dom.enablePrediction) {
                    this.dom.enablePrediction.checked = settings.enablePrediction !== false;
                }
                if (this.dom.adaptiveQuality) {
                    this.dom.adaptiveQuality.checked = settings.adaptiveQuality !== false;
                }
                if (this.dom.showDebug) {
                    this.dom.showDebug.checked = !!settings.showDebug;
                }

                // Selects
                if (this.dom.renderQuality) {
                    this.dom.renderQuality.value = settings.renderQuality || 'medium';
                }
                if (this.dom.renderEngine) {
                    this.dom.renderEngine.value = settings.renderEngine || 'canvas2d';
                }

                this.renderer.setQuality(settings.renderQuality || 'medium');
                this.renderer.setDebug(!!settings.showDebug);
                this.neural.setAccuracy(settings.neuralAccuracy || 85);
            }

            // ============================================================
            // STATUS
            // ============================================================
            _updateStatus(text, state) {
                if (this.dom.statusText) this.dom.statusText.textContent = text;
                if (this.dom.statusDot) {
                    this.dom.statusDot.className = `status-dot ${state || 'online'}`;
                }
            }

            // ============================================================
            // UTILITIES
            // ============================================================
            _formatTime(seconds) {
                if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${String(s).padStart(2, '0')}`;
            }

            // ============================================================
            // DISPOSE
            // ============================================================
            dispose() {
                if (this._animationId) {
                    cancelAnimationFrame(this._animationId);
                    this._animationId = null;
                }
                this.audio.dispose();
                this.renderer.dispose();
                this.toast.show('Application disposed', 'info');
                this.logger.info('Application disposed');
            }
        }

        // ============================================================
        // BOOTSTRAP
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // Polyfill roundRect if needed
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                    const r = typeof radii === 'number' ? radii : (radii || 0);
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                };
            }

            const app = new Application();
            await app.initialize();

            // Expose for debugging
            window.app = app;
        });
    </script>
</body>
